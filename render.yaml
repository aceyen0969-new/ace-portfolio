services:
  - type: web
    name: ace-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false